# Style and audit every cask with Homebrew itself.

name: Audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: brew style and audit
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tap this checkout
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/shipibo-studio"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/shipibo-studio/homebrew-tap"

      - name: Trust this tap (Homebrew 7 refuses to load untrusted taps)
        run: brew trust --tap shipibo-studio/tap

      - name: Style
        run: brew style shipibo-studio/tap

      - name: Audit
        # The online audit asks GitHub's API about the release; shared runners hit the anonymous limit (60/hour).
        # The job's own read-only token lifts it; nothing else is granted.
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for cask in Casks/*.rb; do
            brew audit --cask --online --strict "shipibo-studio/tap/$(basename "$cask" .rb)"
          done
